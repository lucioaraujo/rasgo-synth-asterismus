name: Deploy public site

# The Asterismus page on GitHub Pages
# (https://lucioaraujo.github.io/rasgo-synth-asterismus/). Copied from the
# Trioio workflow (lucioaraujo/trioio, commit cfbd744,
# .github/workflows/deploy-site.yml, same author and licence; itself from the
# Antitotem) on 2026-11-04. The pages are generated locally
# (website/gerar_paginas.py && website/seo.py) and committed.
#
# Published with the first release (2026-11-06): the trigger the Trioio uses
# — a push to main that changes the site, and the manual button.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
