name: Asterismus — build, test & package

# Builds Rasgo Synth Asterismus, runs the whole test suite and generates the
# platform packages on GitHub's hosted runners (real Windows and macOS
# toolchains). Adapted on 2026-11-02 from the Trioio workflow
# (lucioaraujo/trioio, .github/workflows/package.yml, same author), itself
# from the Antitotem one: the targets, the executable name, the JUCE path
# variable and the bundled assets.
#
# RASGO multiplatform distribution standard:
#   - Windows: static VC++ runtime (CMakeLists.txt) + a step that FAILS if the
#     .exe depends on the VC++ Redistributable; NSIS installer + portable .zip;
#   - macOS: Universal 2 (10.15+) and the whole .app sealed ad hoc;
#   - Linux: .deb, AppImage and an installable .tar.gz built on ubuntu-22.04;
#   - JUCE pinned to a tag; a GitHub release from `v*` tags (with a hyphen,
#     e.g. v0.2.0-preview, a pre-release).
# AppImage and four-distribution launch checks are release gates.
#
# Triggers: version tags and the manual button only — never every push nor
# pull requests. Routine validation is local (ctest); CI is the release gate.
# The three-platform run takes about 2–3 hours of wall time; this public repo
# does not consume the author's private Actions-minute quota.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }}, ${{ matrix.generator }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, NOT latest: a .deb inherits the library versions of
          # the machine that built it.
          - os: ubuntu-22.04
            generator: DEB
            artifact-glob: |
              build/final/*.deb
              build/final/*.AppImage
              build/final/*.tar.gz
              build/final/SHA256SUMS
          - os: windows-latest
            generator: NSIS
            artifact-glob: |
              build/*.exe
              build/*.zip
          - os: macos-latest
            generator: DragNDrop
            artifact-glob: build/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Asterismus
        uses: actions/checkout@v5

      # JUCE is not versioned in this repository. Pinned to the tag the
      # instrument is developed with.
      - name: Checkout JUCE
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: '9.0.3'
          path: JUCE-checkout

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRASGO_PERFORMANCE_BUILD_APP=ON
          -DRASGO_PERFORMANCE_JUCE_ROOT=${{ github.workspace }}/JUCE-checkout

      - name: Build (app and tests)
        run: cmake --build build --config Release --parallel 2

      # the whole suite on each system: a platform defect shows here first
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --timeout 900

      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 7 -name "Rasgo Synth Asterismus.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          EXE="$APP/Contents/MacOS/Rasgo Synth Asterismus"
          file "$EXE"
          if ! (lipo -info "$EXE" | grep -q "x86_64" && lipo -info "$EXE" | grep -q "arm64"); then
            echo "::error::Expected a Universal 2 (x86_64+arm64) binary"; exit 1
          fi
          MINOS=$(otool -l "$EXE" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "minos=$MINOS"
          if [[ "$MINOS" != 10.15* ]]; then
            echo "::error::minos $MINOS is not the project's deployment target (10.15)"; exit 1
          fi
          # the fonts travel next to the executable (assetsDirectory())
          test -d "$APP/Contents/MacOS/assets/fonts" \
            || { echo "::error::assets/ missing from the .app"; exit 1; }
          plutil -p "$APP/Contents/Info.plist"
          # Seal the WHOLE bundle ad hoc, both slices (unsealed, Apple Silicon
          # tends to say "is damaged"; sealed, it is the ordinary
          # unidentified-developer warning that INSTALL.md explains).
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for arch in x86_64 arm64; do
            codesign -dv --arch "$arch" "$APP" 2>&1 | grep -q "Signature=adhoc" \
              || { echo "::error::$arch slice without ad-hoc signature"; exit 1; }
          done

      # The .exe must not depend on the Visual C++ Redistributable (this
      # runner has it, so a launch here would never notice).
      - name: No dynamic VC++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build -Filter "Rasgo Synth Asterismus.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error 'Rasgo Synth Asterismus.exe not found'; exit 1 }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse -Path "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $deps = & $dumpbin.FullName /DEPENDENTS $exe.FullName
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt'
          if ($bad) { Write-Error "the .exe depends on the dynamic Visual C++ runtime: $bad"; exit 1 }
          "ok: no dependency on the Visual C++ Redistributable"

      - name: Package
        working-directory: build
        shell: bash
        run: cpack -G "${{ matrix.generator }}" -C Release -B packages

      - name: Build AppImage and installable tar.gz (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(RasgoSynthPerformanceContracts VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          package="rasgo-synth-asterismus-${version}-linux-x86_64"
          mkdir -p .local-build/tooling
          curl --fail --location --connect-timeout 15 --max-time 90 --max-filesize 33554432 \
            -o .local-build/tooling/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          timeout 420 bash packaging/linux/empacotar.sh build build/packages build/final \
            .local-build/tooling/linuxdeploy-x86_64.AppImage \
            packaging/linux/appimage/runtime/runtime-x86_64 \
            packaging/linux/appimage/runtime/LICENSE
          (cd build/final && sha256sum -c SHA256SUMS)
          mkdir -p .local-build/portable-check/home/Music
          tar -xzf "build/final/${package}.tar.gz" \
            -C .local-build/portable-check
          bundle="$PWD/.local-build/portable-check/${package}"
          prefix="$PWD/.local-build/portable-check/home/.local"
          "$bundle/install.sh" --prefix "$prefix"
          test -x "$prefix/bin/rasgo-synth-asterismus"
          "$bundle/install.sh" --remove --prefix "$prefix"

      - name: Validate Linux package checksums
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          (cd build/final && sha256sum -c SHA256SUMS)

      - name: Portable .zip (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: cpack -G ZIP -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: asterismus-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  launch:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: asterismus-ubuntu-22.04
          path: packages
      - name: Install virtual desktop and runtime libraries
        run: |
          case '${{ matrix.image }}' in
            debian:*|ubuntu:*)
              apt-get update
              alsa=libasound2
              test '${{ matrix.image }}' != ubuntu:24.04 || alsa=libasound2t64
              DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth openbox xdotool wmctrl \
                "$alsa" libx11-6 libxext6 libxss1 libxrender1 libxcursor1 libxinerama1 \
                libxrandr2 libfreetype6 libglib2.0-0 libfontconfig1 zlib1g fonts-dejavu-core \
                python3 dpkg
              if test '${{ matrix.image }}' = debian:12 || test '${{ matrix.image }}' = ubuntu:24.04; then
                deb=$(find packages -maxdepth 1 -name '*.deb' -print -quit)
                apt-get install -y "./$deb"
              fi
              ;;
            fedora:*)
              dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth openbox xdotool wmctrl python3 \
                alsa-lib libX11 libXext libXScrnSaver libXrender libXcursor libXinerama \
                libXrandr freetype glib2 fontconfig zlib dejavu-sans-fonts
              ;;
            archlinux:*)
              pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth openbox xdotool wmctrl python \
                alsa-lib libx11 libxext libxss libxrender libxcursor libxinerama libxrandr \
                freetype2 glib2 fontconfig zlib ttf-dejavu
              ;;
          esac
      - name: Open the .deb, AppImage and user-local install
        uses: actions/checkout@v5
      - name: Test package startup
        shell: bash
        run: |
          bash packaging/linux/testar-arranque.sh packages

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, launch]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v7
        with:
          path: pkgs

      - name: Check what arrived
        run: |
          find pkgs -type f -print
          for ext in deb AppImage tar.gz dmg exe zip; do
            find pkgs -type f -name "*.$ext" | grep -q . \
              || { echo "::error::no .$ext package among the artifacts"; exit 1; }
          done
          mkdir -p release
          find pkgs -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' \
            -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Create the release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" ${PRE} \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Rasgo Synth Asterismus ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "Install: see [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md) — on first launch Windows and macOS show a security warning; it is expected (no paid signing). Instalação: veja o INSTALL.md.

          Stated limitation: the Windows and macOS packages were built and checked by CI, not yet opened on real Windows/macOS machines; the macOS package is ad-hoc signed." \
            release/*
